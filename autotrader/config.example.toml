# autotrader configuration. Copy to config.toml (python -m autotrader init).

[general]
mode = "paper"             # "paper" (simulated, default) or "live" (real money)
capital = 1000.0           # paper starting capital; live uses your broker balance
currency = "INR"
state_dir = "state"        # journal, paper account, strategy book, lessons, STOP file
benchmark = "^NSEI"        # Nifty 50, used for regime detection
rebalance_time = "15:10"   # IST; daily decisions just before the close
poll_seconds = 60          # how often the kill switch / stops / Telegram are checked

[risk]                     # hard limits; nothing overrides these
risk_per_trade = 0.02      # lose at most 2% of equity if a stop is hit
max_position_pct = 0.50
max_positions = 3
max_gross_exposure = 1.0   # no leverage
daily_loss_limit = 0.05    # no new entries after -5% in a day
max_drawdown_halt = 0.25   # -25% from peak: close everything and engage the kill switch
atr_stop_mult = 2.5
min_order_value = 50.0
allow_short = false
max_orders_per_day = 20

[costs]                    # Indian delivery (CNC) charges; check your broker's schedule
model = "india_delivery"   # india_delivery | india_intraday | percent
brokerage_flat = 0.0       # Zerodha/Dhan: 0 for delivery. Angel One: 20 (or 0.1%, lower)
brokerage_pct = 0.0
brokerage_cap = 20.0
dp_charge_per_sell = 15.93 # charged per scrip on each day you sell from demat
slippage_bps = 10.0

[backtest]
train_bars = 750           # ~3 years to choose parameters
test_bars = 125            # ~6 months traded out-of-sample, then roll
min_trades = 20
min_oos_sharpe = 0.5
min_profit_factor = 1.15
max_drawdown = 0.35
max_pvalue = 0.2
paper_days_before_live = 20
history_years = 10

[news]
enabled = true
lookback_hours = 36
weight = 0.25              # news can move exposure by at most +/-25%
block_threshold = -0.5     # and block new entries when sharply negative
gdelt = true
global_queries = ["stock market", "RBI policy", "Federal Reserve", "crude oil price",
                  "gold price", "India economy", "geopolitical tension", "inflation"]
  [news.llm]
  provider = "none"        # "anthropic" to score headlines with Claude (paid, capped below)
  model = "claude-haiku-5-5"
  max_calls_per_day = 30

[learning]
eta = 0.5                  # how strongly weights follow scores
max_weight = 0.6           # no single strategy above 60% of the vote
regime_min_trades = 8      # evidence needed before blocking a strategy in a regime
live_trust_trades = 30     # after this many real trades, results outweigh the backtest

[broker]
name = "paper"             # "openalgo" for real orders via a self-hosted OpenAlgo server
  [broker.openalgo]
  host = "http://127.0.0.1:5000"
  api_key_env = "OPENALGO_API_KEY"
  strategy = "autotrader"
  product = "CNC"

[telegram]                 # optional: alerts + /stop /stopall /status /resume from your phone
enabled = false
bot_token_env = "TELEGRAM_BOT_TOKEN"
chat_id_env = "TELEGRAM_CHAT_ID"

[strategies]
dir = "strategies"         # drop .toml rules or .py strategies here any time
enabled = []               # empty = all; add "kronos" to try the Kronos model (needs torch)

